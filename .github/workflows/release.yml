name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            runner: macos-latest
            script: dist:mac
            claw_targets: x86_64-apple-darwin,aarch64-apple-darwin
          - platform: linux
            runner: ubuntu-latest
            script: dist:linux
            claw_targets: x86_64-unknown-linux-gnu
          - platform: windows
            runner: windows-latest
            script: dist:win
            claw_targets: x86_64-pc-windows-msvc

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.claw_targets }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run ${{ matrix.script }}
        env:
          CLAW_BUILD_TARGETS: ${{ matrix.claw_targets }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          overwrite_files: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.blockmap
            release/latest*.yml
